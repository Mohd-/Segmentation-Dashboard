[pytest]
testpaths = tests
# main.py / database.py / dependencies.py live at the repo root, not inside
# tests/, and there is no package __init__.py, so make the root importable.
pythonpath = .
# Characterization suite pins current behavior, including code paths that emit
# DeprecationWarning (e.g. datetime.utcnow() in database.py). Do not turn
# warnings into errors here.
filterwarnings =
    default
